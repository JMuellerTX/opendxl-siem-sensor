[package]
name = "rust-siem-sensor"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
env_logger = "0.11.11"
log = "0.4.34"
rmp = "0.8.15"
rmp-serde = "1.3.1"
rumqttc = "0.25.1"
rustls = "0.23.43"
rustls-pemfile = "2.2.0"
rustls-webpki = "0.102.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
