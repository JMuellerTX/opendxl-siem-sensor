[package]
name = "opendxl-siem-sensor"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Monitoring sensor for OpenDXL / DXL fabrics: normalises fabric events to OCSF and CEF and forwards them to a SIEM"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
env_logger = "0.11.11"
log = "0.4.34"
rdkafka = { version = "0.39.0", optional = true }
reqwest = { version = "0.13.4", features = ["json"] }
rmp = "0.8.15"
rmp-serde = "1.3.1"
rumqttc = "0.25.1"
rust-ini = "0.21.3"
rustls = "0.23.43"
rustls-pemfile = "2.2.0"
rustls-webpki = "0.103"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio-rustls = "0.26.5"

[features]
rdkafka = ["dep:rdkafka"]
